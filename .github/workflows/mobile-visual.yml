name: Mobile visual acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/private-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-visual-screens
          path: mobile-*.png
          if-no-files-found: error
