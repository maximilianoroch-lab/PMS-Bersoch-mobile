name: Mobile improvements CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - run: node --test tests/*.test.cjs
      - run: node --test release/*.test.cjs
