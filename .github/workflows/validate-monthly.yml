name: Validate monthly visualizations
on:
  push:
    paths:
      - index.html
      - .github/workflows/validate-monthly.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and chart wiring
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('index.html').read_text()
          js=[body for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S) if not re.search(r'\bsrc\s*=',attrs,re.I)]
          assert len(js)==1
          pathlib.Path('/tmp/pms-mobile.js').write_text(js[0])
          assert 'evolucion_tipo_mensual_estimado' in js[0]
          assert 'function drawTypes(' in js[0]
          assert 'function renderMonthlyTypes(' in js[0]
          assert 'Denominador: cinco tipos combinados, sin efectivo' in js[0]
          assert 'id="typeBars"' not in s
          PY
          node --check /tmp/pms-mobile.js
          node --test tests/syntax.test.cjs
