name: Verify mobile advisor
on:
  pull_request:
  push:
    branches:
      - main
      - feature/cash-multimoneda-auditoria
jobs:
  safe-netlify-env-metadata:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test read-only env inspection
        run: node --test release/env-status.test.cjs
      - name: Inspect only Netlify variable presence and scope, never values
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node release/env-status.cjs
  advisor-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
      - run: node tests/cache-browser.cjs
      - run: node tests/private-browser.cjs
      - run: npm run build
      - name: Validate controlled release guards and prepare static artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --test release/guard.test.cjs
          node release/controlled-mobile.cjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-mobile-static-${{ github.run_id }}
          path: |
            release-static/
            release-manifest.json
          retention-days: 7
      - name: Read-only hosting and reader audit for trusted same-repo candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PMS_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PMS_GOOGLE_SERVICE_ACCOUNT }}
        run: node release/audit.cjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: mobile-readonly-audit-${{ github.run_id }}
          path: release-audit/result.json
          if-no-files-found: ignore
          retention-days: 7
