name: Verify mobile advisor
on:
  pull_request:
  push:
    branches:
      - feature/cash-multimoneda-auditoria
jobs:
  advisor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/advisor.test.cjs
